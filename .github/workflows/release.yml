name: Publish Release APK

# Push a tag like v0.1.0 to build the signed release APK and publish it as a
# GitHub Release with the APK attached as a downloadable asset.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build & publish release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Stage APK with release name
        id: stage
        run: |
          mkdir -p dist
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          SRC=$(find app/build/outputs/apk/release -name '*.apk' ! -name '*unsigned*' | head -n1)
          if [ -z "$SRC" ]; then
            echo "No signed APK found" >&2
            exit 1
          fi
          OUT="dist/jarvis-ai-${TAG}.apk"
          cp "$SRC" "$OUT"
          echo "apk=$OUT" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Jarvis-AI ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: ${{ steps.stage.outputs.apk }}
